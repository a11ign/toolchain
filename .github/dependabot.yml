# Dependency updates come from the platform (a11ign/a11ign ADR 0041, decision 4): a new release of anything this repository consumes
# opens a pull request here, so nobody polls for one. This package is consumed BY VERSION by the other repositories, whose own
# Dependabot offers them each release of it.
version: 2
updates:
  - package-ecosystem: npm
    # ONE entry at the root covers the package.
    directory: /
    schedule:
      interval: daily
    # No `groups:` on purpose: each dependency is its own pull request, which is what keeps a bump small and mergeable alone.
    commit-message:
      # The handle the org's gate recognises a dependency pull request by: every title starts `deps:`.
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: deps
