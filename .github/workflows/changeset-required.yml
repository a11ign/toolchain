# A PULL REQUEST THAT CHANGES A RELEASABLE PATH MUST CARRY A CHANGESET OR SAY WHY NOT, IN EVERY REPOSITORY (chairman, via ceo, a11ign/a11ign#4084; row #4127).
# screenreader-worker#25 and #26 each changed shipped code with no `.changeset/` file and merged, and nothing released them: the per-merge release
# (`release-per-merge.yml`) releases a changeset, so a change with none is invisible to it. `scripts/changeset-required.mjs` holds the decision and
# `scripts/changeset-required.test.ts` runs it; this file only gathers the inputs.
#
# A CALLER passes its own `releasable-paths` as ONE space-separated string (a reusable workflow's inputs cannot be lists): its `dora` entry's
# `releasablePaths` in a11ign/a11ign `.agent-org/project.json`, joined by a space (`src/ packages/nvda-speech/` for the worker). It must equal that
# entry: the worker's was wrong until a11ign/a11ign#4092, and a path that matches nothing passes every pull request.
#
#   on:
#     pull_request: { types: [opened, synchronize, reopened, edited] }   # `edited`: the `no-release:` line is added by editing the body
#     merge_group:
#   jobs:
#     changeset:
#       permissions: { contents: read, pull-requests: read }   # a called workflow cannot hold more than its caller gives: without this the whole run is a `startup_failure`
#       uses: a11ign/toolchain/.github/workflows/changeset-required.yml@<full sha>
#       with: { releasable-paths: "src/ packages/nvda-speech/" }
#     gate:
#       needs: [changeset, ...]
#       if: always()                      # a gate skipped because a need failed reads as PASSED: see this repository's ci.yml
#       ...                               # and accepts `success` only, so a check that did not run is not a check that passed
#
# THE PULL REQUEST DECIDES, NOT THE QUEUE ENTRY. A `merge_group` entry has no body and no pull request, so on one the job SUCCEEDS WITHOUT
# EVALUATING (the pull request's own run already decided, and a required check that never reports blocks the queue for ever). It succeeds rather than
# skips, because a skipped job counts as passed for a required check and the caller's `gate` accepts `success` only.
#
# A CALLER PINS THIS FILE BY FULL SHA, as it pins `release-per-merge.yml`, and its Dependabot `github-actions` entry moves the pin. The script is
# fetched at `job.workflow_sha`, the commit this file was read from, so the pin selects both. THE CALLER'S CODE IS NEVER CHECKED OUT OR RUN: this job
# reads the pull request through the API and runs one script of ours, so it holds `pull-requests: read` and `contents: read` and no more. The body
# and the paths reach the script through `env`, never interpolated into a shell line: a body is whatever its author typed.
name: changeset-required

on:
  workflow_call:
    inputs:
      releasable-paths:
        description: "The repository's releasable paths as ONE space-separated string: its dora entry's `releasablePaths` joined by a space (`src/ packages/nvda-speech/`). A pull request that changes a non-test file under one needs a changeset or a `no-release:` line."
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-required:
    runs-on: ubuntu-latest
    steps:
      - name: A merge-group entry is not evaluated here
        if: github.event_name == 'merge_group'
        run: echo "A merge-group entry has no pull request body, so nothing is evaluated on it; the pull request's own run decided." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The script, from the commit this workflow was read from
        if: github.event_name != 'merge_group'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .changeset-required-tool
          sparse-checkout: scripts/changeset-required.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The pull request's changed files
        if: github.event_name != 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        # `bash` is `bash -eo pipefail`, so an API failure fails this step instead of leaving a short list that reads as a pass.
        run: gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files" --jq '.[] | {filename, status, previous_filename}' > "$RUNNER_TEMP/files.jsonl"
      - name: A releasable change needs a changeset or a no-release line
        if: github.event_name != 'merge_group'
        shell: bash
        env:
          FILES_JSONL: ${{ runner.temp }}/files.jsonl
          PR_BODY: ${{ github.event.pull_request.body }}
          RELEASABLE_PATHS: ${{ inputs.releasable-paths }}
        run: node .changeset-required-tool/scripts/changeset-required.mjs | tee -a "$GITHUB_STEP_SUMMARY"
