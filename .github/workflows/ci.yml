# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests (`checks`), the changeset check
# (`changeset`) and, when a change touches what the release installs from, the release's version step (`release-dry-run`); the last job below, `gate`, waits for all three. It is named `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require
# (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# Ubuntu only, on purpose: the toolchain drives nothing real. What a consumer's own tests need (a worker, a browser, a screen reader)
# is that consumer's gate, and this repository's `consumer-check` is the part of it that is ours: the packed tarball installed
# into an empty project, every export imported, a strict consumer `tsc`, and an `rstest run` that prints its VERDICT line.
name: ci

on:
  # `edited` because the changeset check reads the pull request's BODY: adding its `no-release:` line is an edit, and a run that did not repeat
  # would leave the check red on a body that is now right. The cost is the whole gate once per body edit, which is deliberate: the concurrency group
  # below cancels the run an edit interrupts, so an edit must run everything or it would cancel a full run for a partial one.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A releasable change needs a changeset or a `no-release:` line (a11ign/a11ign#4127). This repository is the first adopter of its own shared check,
  # called by LOCAL path: a reusable workflow is consumed by sha and not by release, so adopting it here needs no changeset. `src/` is
  # this repository's `dora` entry's `releasablePaths`. On a merge-group entry the called job succeeds without evaluating.
  changeset:
    # A called workflow cannot hold more than its caller gives, and this file's `contents: read` alone made GitHub refuse the whole run at startup
    # (`startup_failure`: no job, no log). The called workflow reads the pull request's files, so it needs `pull-requests: read` too.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changeset-required.yml
    with:
      releasable-paths: src/

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm`
      # shells out to it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `build` comes first because the repository's own `rstest.config.ts` imports the BUILT package (the alias hook is a `.mjs` a
      # worker loads by path), and `typecheck` reads that build's declarations. Lint and typecheck run before the tests so a style or
      # type failure reads red without waiting for the suite.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run consumer-check
      # THE RELEASE PACKS WHAT `prepack` BUILDS, and this step refuses a tarball that is missing any `exports` target or the bin (a11ign/a11ign#4310). It reads
      # `npm pack --dry-run --json`, not the source tree, and removes `dist` first: the steps above have built it, and a stale `dist` would let a missing `prepack`
      # pass. 0.1.6 was published with 4 files because #4213 dropped `prepack` and the release packed an unbuilt tree; `gate`, which the release waits for, now
      # stands behind this step.
      - run: pnpm run pack-check
      # The layout check this package publishes, run from the BUILD of this tree (`pack-check` has just rebuilt it). It was `pnpm dlx @a11ign/toolchain`, the
      # registry's `latest`, and that made every pull request's gate depend on the last release: 0.1.6 had no `dist`, so the fix for it could not go green.
      # The registry's package is accepted by `consumer-check`'s `@a11ign/toolchain@<version>` form, which a release is checked against.
      - run: node dist/layout-check.mjs

  # A PULL REQUEST THAT CHANGES HOW THIS TREE INSTALLS DRY-RUNS THE RELEASE'S VERSION STEP (a11ign/a11ign#5062; chairman, a11ign/agent-org#885 class 3 and #888). a11ign/agent-org#871 changed the
  # install, passed its own suite, and the first sign of the break was five failed releases on `main`: nothing on the pull request ran the path the release takes. `release.yml` calls
  # `release-per-merge.yml`, whose `version` job is `pnpm install --frozen-lockfile`, this repository's OWN `changeset version`, then `pnpm install --lockfile-only`. This job runs those
  # three commands in a scratch clone of the candidate tree, and writes nothing: `contents: read`, no credential kept by the checkout, no push, no token.
  #
  # IT RUNS ON EVERY EVENT AND DOES ITS WORK ONLY WHEN THE CHANGE TOUCHES `package.json`, `pnpm-lock.yaml`, `.npmrc` OR `.github/workflows/`. GitHub filters `paths:` per WORKFLOW and not per job,
  # and a workflow-wide filter would skip `gate` with it, so the job reads the paths itself and the steps after `touched` are conditional on it: an untouched change is a `success` here,
  # never a skip, and `gate` keeps accepting `success` alone. The paths are judged against the first parent of the checked-out commit: the merge ref of a pull request or a merge-queue entry.
  #
  # THE TOOLS ARE THIS REPOSITORY'S RELEASE, NOT agent-org's: `release.yml` sets no `pnpm-version`, `node-version` or `changesets-version`, so the release runs pnpm from `packageManager`
  # (`pnpm/action-setup` below reads it the same way), Node `22` (`release-per-merge.yml`'s default, and `checks`' own), and the `@changesets/cli` in `pnpm-lock.yaml` (the called workflow's
  # `changesets-version` is read only where there is no lockfile, so it is not repeated here). A change that sets one of them in `release.yml` moves this job with it, by hand.
  #
  # NO CONSUMER-INSTALL STEP (a11ign/agent-org#967 has one): that step is what a11ign's `agent-org-newest-tag` makes of an agent-org TAG, cloning it and installing from its lockfile. This
  # repository's releases are npm packages, installed from the registry, and `consumer-check` in `checks` installs the packed tarball; no consumer clones one of its tags. It versions EVERY
  # changeset in the tree, where the release versions only those no tag has consumed: a superset, so a failure the release would meet is met here (which ones no tag has consumed is its
  # `plan` step's question, and this job does not ask it).
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The WHOLE history, as the release's own checkout takes it (`release-per-merge.yml`, `fetch-depth: 0`). `changeset version` deepens a SHALLOW clone to find the
          # commit that added each changeset, and does so for every changeset at once: the first run of this job died in that deepening (`fatal: shallow file has changed
          # since we read it`), a failure the release can never meet. No credential is kept: nothing here pushes.
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch what the release installs from?
        id: touched
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "changed paths:"
          echo "$changed"
          if grep -q -E '^(package\.json|pnpm-lock\.yaml|\.npmrc)$|^\.github/workflows/' <<<"$changed"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "no install-affecting path changed: the release dry run is not needed"
          fi
      # With no `version`, the action reads `packageManager`, which is what the release's `setup` step leaves it to do.
      - uses: pnpm/action-setup@v6
        if: steps.touched.outputs.touched == 'true'
      - uses: actions/setup-node@v7
        if: steps.touched.outputs.touched == 'true'
        with:
          node-version: 22
      - name: The release's version step, dry-run on a scratch clone -- install, changeset version, lockfile refresh
        if: steps.touched.outputs.touched == 'true'
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/release-dry-run"
          git clone --quiet "file://$GITHUB_WORKSPACE" "$scratch"
          cd "$scratch"
          pnpm install --frozen-lockfile
          pnpm exec changeset version
          pnpm install --lockfile-only

  # THE REQUIRED CHECK. `main`'s protection and the `merge-queue-main` ruleset name `gate`, so it stays the one check that answers for the run. It
  # waits for the jobs above and accepts `success` ONLY: `always()` because a job whose need failed is SKIPPED, and a skipped required check counts as
  # passed; and no `skipped` allowance, because the changeset job succeeds on a merge-group entry rather than skipping, and `release-dry-run` succeeds when its paths are untouched, so a skip here means it did not run.
  gate:
    needs: [changeset, checks, release-dry-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran, and ran clean
        run: |
          for result in "${{ needs.changeset.result }}" "${{ needs.checks.result }}" "${{ needs.release-dry-run.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a job reported '$result', not success"
              exit 1
            fi
          done
