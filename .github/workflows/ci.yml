# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests, and the single job below
# is named `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require
# (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# Ubuntu only, on purpose: the toolchain drives nothing real. What a consumer's own tests need (a worker, a browser, a screen reader)
# is that consumer's gate, and this repository's `consumer-check` is the part of it that is ours: the packed tarball installed
# into an empty project, every export imported, a strict consumer `tsc`, and an `rstest run` that prints its VERDICT line.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm`
      # shells out to it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `build` comes first because the repository's own `rstest.config.ts` imports the BUILT package (the alias hook is a `.mjs` a
      # worker loads by path), and `typecheck` reads that build's declarations. Lint and typecheck run before the tests so a style or
      # type failure reads red without waiting for the suite.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run consumer-check
