# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests (`checks`) and the changeset check
# (`changeset`), and the last job below, `gate`, waits for both. It is named `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require
# (`docs/code-repository-protection.json` in a11ign/a11ign names it). `merge_group` is what lets the queue's
# temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# Ubuntu only, on purpose: the toolchain drives nothing real. What a consumer's own tests need (a worker, a browser, a screen reader)
# is that consumer's gate, and this repository's `consumer-check` is the part of it that is ours: the packed tarball installed
# into an empty project, every export imported, a strict consumer `tsc`, and an `rstest run` that prints its VERDICT line.
name: ci

on:
  # `edited` because the changeset check reads the pull request's BODY: adding its `no-release:` line is an edit, and a run that did not repeat
  # would leave the check red on a body that is now right. The cost is the whole gate once per body edit, which is deliberate: the concurrency group
  # below cancels the run an edit interrupts, so an edit must run everything or it would cancel a full run for a partial one.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A releasable change needs a changeset or a `no-release:` line (a11ign/a11ign#4127). This repository is the first adopter of its own shared check,
  # called by LOCAL path: a reusable workflow is consumed by sha and not by release, so adopting it here needs no changeset. `src/` is
  # this repository's `dora` entry's `releasablePaths`. On a merge-group entry the called job succeeds without evaluating.
  changeset:
    # A called workflow cannot hold more than its caller gives, and this file's `contents: read` alone made GitHub refuse the whole run at startup
    # (`startup_failure`: no job, no log). The called workflow reads the pull request's files, so it needs `pull-requests: read` too.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changeset-required.yml
    with:
      releasable-paths: src/

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm`
      # shells out to it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `build` comes first because the repository's own `rstest.config.ts` imports the BUILT package (the alias hook is a `.mjs` a
      # worker loads by path), and `typecheck` reads that build's declarations. Lint and typecheck run before the tests so a style or
      # type failure reads red without waiting for the suite.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run consumer-check
      # The layout check this package publishes, run from the REGISTRY the way a consumer runs it, so this repository is held to the version a consumer gets.
      # Not `npx --package @a11ign/toolchain layout-check`: npx finds the root's own name and looks for the unbuilt local bin ("layout-check: not found"), and
      # the published 0.1.5 bin carries no shebang, so npx's direct exec fails under sh. `pnpm dlx` runs the package's one bin through node, and its bin name
      # is not repeated (a second word is read as the directory to check).
      - run: pnpm dlx @a11ign/toolchain

  # THE REQUIRED CHECK. `main`'s protection and the `merge-queue-main` ruleset name `gate`, so it stays the one check that answers for the run. It
  # waits for both jobs above and accepts `success` ONLY: `always()` because a job whose need failed is SKIPPED, and a skipped required check counts as
  # passed; and no `skipped` allowance, because the changeset job succeeds on a merge-group entry rather than skipping, so a skip here means it did not run.
  gate:
    needs: [changeset, checks]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran, and ran clean
        run: |
          for result in "${{ needs.changeset.result }}" "${{ needs.checks.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a job reported '$result', not success"
              exit 1
            fi
          done
